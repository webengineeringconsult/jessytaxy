name: jessytaxy
description: "JessyTaxi - Ride Safe. Ride Smart. Accra & Tema Only"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
